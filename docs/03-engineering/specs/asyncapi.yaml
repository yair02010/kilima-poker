    table_open:
      name: table:open
      summary: Open (observe) a table
      payload:
        type: object
        additionalProperties: false
        properties:
          tableId: {}
      x-ack-data:
      - snapshot
    table_close:
      name: table:close
      summary: Close a table view
      payload:
        type: object
        additionalProperties: false
        properties:
          tableId: {}
      x-ack-data: []
    table_sit:
