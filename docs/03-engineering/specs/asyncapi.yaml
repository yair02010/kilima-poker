components:
  messages:
    session_ready:
      name: session:ready
      summary: Session established
      payload:
        type: object
        additionalProperties: false
        properties:
          accountId: {}
          screenName: {}
          mode: {}
          serverTime: {}
          tables: {}
          fastfold: {}
          tournaments: {}
      x-private: true
    session_refresh:
      name: session:refresh
      summary: Refresh the access token on an open socket
      payload:
        type: object
        additionalProperties: false
        properties:
          token: {}
      x-ack-data:
      - expiresAt
    session_replaced:
      name: session:replaced
      summary: Another connection took over
      payload:
        type: object
        additionalProperties: false
        properties: {}
      x-private: true
    session_revoked:
      name: session:revoked
      summary: Session revoked; socket closed
      payload:
        type: object
        additionalProperties: false
        properties:
          reason: {}
      x-private: true
    system_announcement:
      name: system:announcement
      summary: Announcement
      payload:
        type: object
        additionalProperties: false
        properties:
          id: {}
          title: {}
          body: {}
          level: {}
    system_maintenance:
      name: system:maintenance
      summary: Planned maintenance
      payload:
        type: object
        additionalProperties: false
        properties:
          startsAt: {}
          message: {}
    wallet_balance:
      name: wallet:balance
      summary: Balance changed
      payload:
        type: object
        additionalProperties: false
        properties:
          currency: {}
          cash: {}
          bonus: {}
          locked: {}
          onTables: {}
      x-private: true
    limits_warning:
      name: limits:warning
      summary: Responsible-gaming reality check or limit warning
      payload:
        type: object
        additionalProperties: false
        properties:
          kind: {}
          used: {}
          limit: {}
          sessionMinutes: {}
          netResult: {}
      x-private: true
    lobby_subscribe:
      name: lobby:subscribe
      summary: Subscribe to a pool's lobby
      payload:
        type: object
        additionalProperties: false
        properties:
          poolId: {}
          format: {}
          variant: {}
          stakes: {}
      x-ack-data:
      - snapshot
    lobby_update:
      name: lobby:update
      summary: Lobby delta
      payload:
        type: object
        additionalProperties: false
        properties:
          poolId: {}
          upserts: {}
          removals: {}
    lobby_unsubscribe:
      name: lobby:unsubscribe
      summary: Unsubscribe
      payload:
        type: object
        additionalProperties: false
        properties:
          poolId: {}
      x-ack-data: []
    lobby_waitlist_join:
      name: lobby:waitlist_join
      summary: Join a waitlist
      payload:
        type: object
        additionalProperties: false
        properties:
          tableId: {}
          templateId: {}
      x-ack-data:
      - position
    lobby_waitlist_leave:
      name: lobby:waitlist_leave
      summary: Leave a waitlist
      payload:
        type: object
        additionalProperties: false
        properties:
          tableId: {}
          templateId: {}
      x-ack-data: []
    lobby_seat_offer:
