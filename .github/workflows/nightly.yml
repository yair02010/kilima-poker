# Nightly engine profile (KP-ENG-06 §13, KP-HBK-11 §7, WP-06 slice 3):
# 10^6 random hands with every invariant checked, applyAction latency, and the full differential test
# against poker_reference.py. Reports are uploaded as artifacts. Also runnable by hand (workflow_dispatch).
name: Nightly engine

on:
  schedule:
    - cron: "17 1 * * *" # 01:17 UTC daily
  workflow_dispatch:
    inputs:
      hands:
        description: Number of random hands for the property profile
        default: "1000000"

permissions:
  contents: read

jobs:
  engine-scale:
    name: Engine at scale
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HANDS: ${{ github.event.inputs.hands || '1000000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Property profile (10^6 hands, all invariants)
        run: pnpm --filter @kilima/engine-poker property "$HANDS" 1 "$RUNNER_TEMP/property-report.json"
      - name: Differential (10^5 evaluation + betting + settlement hands vs poker_reference.py)
        run: pnpm --filter @kilima/engine-poker differential 100000 "$GITHUB_RUN_NUMBER" | tee "$RUNNER_TEMP/differential.txt"
      - name: Benchmarks (informational)
        run: pnpm --filter @kilima/engine-poker bench | tee "$RUNNER_TEMP/bench.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engine-nightly-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/property-report.json
            ${{ runner.temp }}/differential.txt
            ${{ runner.temp }}/bench.txt
