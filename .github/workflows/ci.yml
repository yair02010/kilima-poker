# CI pipeline (KP-OPS-01 §3), the stages that apply before cloud exists (WP-01 slice 3):
# 1 install · 2 static checks · 3 unit tests · 5 security · 6 build (image, SBOM, provenance,
# cosign signature) · 7 image scan. Integration tests (4) arrive with the first service that has
# a database; contract checks with packages/contracts (WP-04); deploy stages (8–10) in S4.
# Third-party actions are pinned to full commit SHAs; the comment shows the release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kilima-sample

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}
          restore-keys: turbo-static-
      - name: Lint (ESLint incl. Kilima rules, Prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest (all packages)
        run: pnpm test
      - name: Engine vectors (test_vectors.json, exhaustive frequencies)
        run: pnpm vectors
      - name: Engine differential (10^5 hands vs poker_reference.py)
        run: pnpm --filter @kilima/engine-poker differential

  dossier:
    name: Dossier checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt
      - run: pip install -r tools/requirements-docs.txt
      - name: Document references
        run: python docs/tools/check_references.py
      - name: API docs vs OpenAPI/AsyncAPI
        run: python docs/tools/check_api_consistency.py

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
      - name: Dependency audit (production, high and critical)
        run: pnpm audit --prod --audit-level high

  image:
    name: Image (sample)
    needs: [static, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Publish on main and on PRs from this repository (forks get no write token).
      PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build metadata
        id: build
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=pr
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/sample/Dockerfile
          load: true
          tags: kilima-sample:ci
          build-args: |
            BUILD_VERSION=0.0.0-${{ steps.build.outputs.short }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
          cache-from: type=gha,scope=sample
          cache-to: type=gha,scope=sample,mode=max
      - name: Smoke test (container starts and answers /healthz and /version)
        run: |
          docker run -d --name sample -p 8080:8080 kilima-sample:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/version
          docker stop -t 10 sample
          docker logs sample
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kilima-sample:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-sample.json
          exit-code: "0"
      - name: Image scan gate (critical/high with a fix block)
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
            "::error title=\(.VulnerabilityID) \(.Severity)::\($t) \(.PkgName) \(.InstalledVersion) → fixed in \(.FixedVersion) — \(.Title // "")"' \
            trivy-sample.json | tee trivy-findings.txt
          count=$(wc -l < trivy-findings.txt)
          echo "Trivy: $count critical/high vulnerabilities with a fix available"
          test "$count" -eq 0
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: kilima-sample:ci
          format: spdx-json
          output-file: sbom-sample.spdx.json
          artifact-name: sbom-sample.spdx.json
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/sample/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=0.0.0-${{ steps.build.outputs.short }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
          cache-from: type=gha,scope=sample
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - name: Sign image (cosign keyless) and attach SBOM
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom-sample.spdx.json "$REF"
      - name: Build provenance (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo "\`$REF\`"
            echo
            echo "Verify: \`cosign verify $REF --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
